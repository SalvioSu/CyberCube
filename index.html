<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚡ CyberCube ⚡</h1>
    
    <div class="instructions">
        <p>遊戲說明：躲過紅色方塊，點擊綠色方塊，你能堅持多久？</p>
    </div>

    <div class="settings">
        <span>版面設置：</span>
        <div>
            <select id="colsSelect">
                <option value="10">10</option>
                <option value="9">9</option>
                <option value="8">8</option>
                <option value="7">7</option>
                <option value="6">6</option>
                <option value="5">5</option>
            </select>
        </div>
        <span>x</span>
        <div>
            <select id="rowsSelect">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
    </div>

    <div class="scoreboard">
        <div>存活時間: <span id="time_exist">0</span>秒</div>
        <div>剩餘時間: <span id="time_left">60</span> 秒</div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="controls">
        <button id="startBtn">開始遊戲</button>
    </div>

    <!-- 載入模組化 JS -->
    <script type="module">
        import CyberCube from './CyberCube.js';

        // 初始化遊戲實例
        const game = new CyberCube({
            gridContainerId: 'grid',
            scoreId: 'time_exist',
            timerId: 'time_left',
            startBtnId: 'startBtn',
            rowsSelectId: 'rowsSelect',
            colsSelectId: 'colsSelect'
        });
    </script>
</body>
</html>
