<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定義網格閃動格子 (CyberCube)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚡ 閃動格子 ⚡</h1>
    
    <div class="settings">
        <div>
            <label for="rowsSelect">列數 (Y):</label>
            <select id="rowsSelect">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <div>
            <label for="colsSelect">行數 (X):</label>
            <select id="colsSelect">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
    </div>

    <div class="scoreboard">
        <div>分數: <span id="score">0</span></div>
        <div>時間: <span id="timer">30</span> 秒</div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="controls">
        <button id="startBtn">開始遊戲</button>
    </div>

    <!-- 載入模組化 JS -->
    <script type="module">
        import CyberCube from './CyberCube.js';

        // 初始化遊戲實例
        const game = new CyberCube({
            gridContainerId: 'grid',
            scoreId: 'score',
            timerId: 'timer',
            startBtnId: 'startBtn',
            rowsSelectId: 'rowsSelect',
            colsSelectId: 'colsSelect'
        });
    </script>
</body>
</html>
