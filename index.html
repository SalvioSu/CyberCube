<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動態網格閃動格子 (CyberCube)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>⚡ 閃動格子 ⚡</h1>
    
    <div class="settings">
        <label for="gridSizeSelect">選擇網格尺寸：</label>
        <select id="gridSizeSelect">
            <option value="4x4">4 x 4 (16格)</option>
            <option value="5x5" selected>5 x 5 (25格)</option>
            <option value="6x6">6 x 6 (36格)</option>
            <option value="7x7">7 x 7 (49格)</option>
            <option value="8x8">8 x 8 (64格)</option>
        </select>
    </div>

    <div class="scoreboard">
        <div>分數: <span id="score">0</span></div>
        <div>時間: <span id="timer">30</span> 秒</div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="controls">
        <button id="startBtn">開始遊戲</button>
    </div>

    <!-- 載入模組化 JS -->
    <script type="module">
        import CyberCube from './CyberCube.js';

        // 初始化遊戲實例
        const game = new CyberCube({
            gridContainerId: 'grid',
            scoreId: 'score',
            timerId: 'timer',
            startBtnId: 'startBtn',
            sizeSelectId: 'gridSizeSelect'
        });
    </script>
</body>
</html>
