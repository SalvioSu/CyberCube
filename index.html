<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCube</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

    <h1>⚡ CyberCube ⚡</h1>
    
    <div class="instructions">
        <p>遊戲說明：躲過紅色方塊，點擊綠色方塊，你能堅持多久？</p>
    </div>

    <div class="settings">
        <span>版面設置：</span>
        <div>
            <select id="colsSelect">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <span>x</span>
        <div>
            <select id="rowsSelect">
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <!-- 純 SVG 喇叭圖示按鈕 -->
        <button id="muteBtn" class="mute-icon-btn" title="切換音樂靜音">
            <svg id="volumeIcon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
        </button>
    </div>

    <div class="scoreboard">
        <div>存活時間: <span id="time_exist">0</span>秒</div>
        <div>剩餘時間: <span id="time_left">60</span> 秒</div>
    </div>

    <!-- 包覆遊戲面板與按鈕的外層容器 -->
    <div class="game-wrapper">
        <div class="grid-container" id="grid"></div>
        <button id="startBtn" class="overlay-start-btn">開始遊戲</button>
    </div>

    <!-- 載入模組化 JS -->
    <script type="module">
        import CyberCube from './CyberCube.js';

        // 初始化遊戲實例
        const game = new CyberCube({
            gridContainerId: 'grid',
            scoreId: 'time_exist',
            timerId: 'time_left',
            startBtnId: 'startBtn',
            rowsSelectId: 'rowsSelect',
            colsSelectId: 'colsSelect',
            muteBtnId: 'muteBtn'
        });
    </script>
</body>
</html>
