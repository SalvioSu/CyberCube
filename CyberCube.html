<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版閃動格子 (CyberCube)</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 5px;
            text-shadow: 0 0 10px #00ffff;
        }

        .scoreboard {
            display: flex;
            gap: 30px;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(4, 90px);
            gap: 10px;
            background-color: #161b22;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .cell {
            background-color: #21262d;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s, box-shadow 0.15s;
        }

        /* 格子狀態 */
        .cell.blue {
            background-color: #00d2ff;
            box-shadow: 0 0 15px #00d2ff;
        }

        .cell.red {
            background-color: #ff4757;
            box-shadow: 0 0 15px #ff4757;
        }

        .cell.green {
            background-color: #2ed573;
            box-shadow: 0 0 15px #2ed573;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background-color: #00ffff;
            color: #0d1117;
            border: none;
            padding: 10px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            transition: 0.2s;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #fff;
        }
    </style>
</head>
<body>

    <h1>⚡ 閃動格子 ⚡</h1>
    <div class="scoreboard">
        <div>分數: <span id="time_exist">0</span></div>
        <div>時間: <span id="time_left">30</span> 秒</div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="controls">
        <button id="startBtn" onclick="startGame()">開始遊戲</button>
    </div>

    <script>
        const gridContainer = document.getElementById('grid');
        const scoreDisplay = document.getElementById('time_exist');
        const timerDisplay = document.getElementById('time_left');
        const startBtn = document.getElementById('startBtn');

        const gridSize = 16; // 4x4 網路格子
        let cells = [];
        let time_exist = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let spawnInterval = null;
        let isPlaying = false;

        // 初始化建立 4x4 格子
        function initGrid() {
            gridContainer.innerHTML = '';
            cells = [];
            for (let i = 0; i < gridSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleCellClick(i));
                gridContainer.appendChild(cell);
                cells.push(cell);
            }
        }

        // 開始遊戲
        function startGame() {
            // 重置狀態
            initGrid();
            time_exist = 0;
            timeLeft = 30;
            scoreDisplay.textContent = time_exist;
            timerDisplay.textContent = timeLeft;
            startBtn.disabled = true;
            isPlaying = true;

            // 倒數計時器
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // 隨機生成亮燈格子
            spawnInterval = setInterval(updateCells, 600);
        }

        // 隨機改變格子狀態
        function updateCells() {
            // 隨機清除部分格子或重置
            cells.forEach(cell => {
                cell.className = 'cell';
            });

            // 決定這次要亮幾個格子 (1 ~ 3個)
            let activeCount = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < activeCount; i++) {
                let randomIndex = Math.floor(Math.random() * gridSize);
                let cell = cells[randomIndex];

                // 隨機決定格子類型：70% 藍色(加分), 20% 紅色(扣分), 10% 綠色(大加分)
                let randType = Math.random();
                if (randType < 0.7) {
                    cell.classList.add('blue');
                } else if (randType < 0.9) {
                    cell.classList.add('red');
                } else {
                    cell.classList.add('green');
                }
            }
        }

        // 點擊格子邏輯
        function handleCellClick(index) {
            if (!isPlaying) return;

            let cell = cells[index];
            if (cell.classList.contains('blue')) {
                time_exist += 10;
                cell.className = 'cell'; // 點掉後熄滅
            } else if (cell.classList.contains('green')) {
                time_exist += 30;
                cell.className = 'cell';
            } else if (cell.classList.contains('red')) {
                time_exist -= 20;
                cell.className = 'cell';
            }
            scoreDisplay.textContent = time_exist;
        }

        // 結束遊戲
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            cells.forEach(cell => cell.className = 'cell');
            startBtn.disabled = false;
            alert(`時間到！你的最終得分是：${time_exist} 分`);
        }

        // 初始化畫面
        initGrid();
    </script>
</body>
</html>
